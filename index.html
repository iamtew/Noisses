<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noisses</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" hidden>× push · sticks steer</div>
    <div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
      <h1 id="gate-title" data-overlay-title>CONTROLLER REQUIRED</h1>
      <p data-overlay-body>
        Connect a gamepad with two analog sticks.
        This is a dual-stick foot-control skate simulator.
        Keyboard is not supported for skating.
      </p>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
